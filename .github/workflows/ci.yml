name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify vendored upstreams
        run: ./scripts/check_upstreams.sh
      - name: Test and compile Android/iOS samples
        run: ./gradlew iosSimulatorArm64Test :sample:composeApp:assembleDebug linkDebugFrameworkIosSimulatorArm64 :sample:composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
