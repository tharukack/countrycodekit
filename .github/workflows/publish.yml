name: Publish and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
        type: string

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release version and upstream pins
        run: |
          ./scripts/check_upstreams.sh
          test "${RELEASE_TAG#v}" = "$(./gradlew properties -q | awk '/^version:/ { print $2 }')"
      - name: Build and test
        run: ./gradlew iosSimulatorArm64Test build --stacktrace
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      - name: Create GitHub release
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "CountryCodeKit Compose ${RELEASE_TAG#v}"
        env:
          GH_TOKEN: ${{ github.token }}
