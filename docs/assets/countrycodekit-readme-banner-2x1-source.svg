<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="phoneEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f5869"/>
      <stop offset="0.45" stop-color="#172a39"/>
      <stop offset="1" stop-color="#050e16"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70e6c1"/>
      <stop offset="1" stop-color="#35ad8b"/>
    </linearGradient>
    <filter id="phoneShadow" x="-50%" y="-30%" width="200%" height="180%">
      <feDropShadow dx="0" dy="25" stdDeviation="24" flood-color="#000a10" flood-opacity="0.58"/>
    </filter>
    <filter id="markShadow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#49c6a1" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Selected globe logo, intentionally without a plus mark. -->
  <g transform="translate(82 70)" filter="url(#markShadow)">
    <rect width="76" height="76" rx="21" fill="url(#mark)"/>
    <circle cx="38" cy="38" r="25" fill="none" stroke="#092033" stroke-width="4"/>
    <path d="M13 38h50M38 13c9 8 14 16 14 25s-5 17-14 25M38 13c-9 8-14 16-14 25s5 17 14 25" fill="none" stroke="#092033" stroke-width="3.6" stroke-linecap="round"/>
  </g>
  <text x="184" y="122" fill="#f8fffc" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="39" font-weight="750" letter-spacing="-1.2">CountryCodeKit</text>
  <text x="471" y="122" fill="#61dbb5" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="39" font-weight="750" letter-spacing="-1.2">Compose</text>

  <rect x="82" y="210" width="42" height="5" rx="2.5" fill="#55d5ae"/>
  <text x="144" y="220" fill="#6ce0bc" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3.3">COUNTRY CALLING CODES</text>

  <text x="82" y="323" fill="#f8fffc" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Country selection</text>
  <text x="82" y="405" fill="#f8fffc" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">that feels native.</text>

  <text x="82" y="480" fill="#bad0ca" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="450">Search, format, and validate phone numbers</text>
  <text x="82" y="518" fill="#bad0ca" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="450">— entirely offline.</text>

  <g transform="translate(82 570)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="650">
    <rect width="164" height="50" rx="15" fill="#49c6a1" fill-opacity="0.11" stroke="#5ad8b1" stroke-opacity="0.38"/>
    <text x="22" y="32" fill="#dcf8ef">271 countries</text>
    <rect x="177" width="178" height="50" rx="15" fill="#49c6a1" fill-opacity="0.11" stroke="#5ad8b1" stroke-opacity="0.38"/>
    <text x="199" y="32" fill="#dcf8ef">Android + iOS</text>
    <rect x="368" width="144" height="50" rx="15" fill="#49c6a1" fill-opacity="0.11" stroke="#5ad8b1" stroke-opacity="0.38"/>
    <text x="390" y="32" fill="#dcf8ef">Offline first</text>
  </g>

  <!-- Device outline; authentic screenshot is composited beneath this layer. -->
  <g filter="url(#phoneShadow)">
    <rect x="1224" y="31" width="350" height="738" rx="69" fill="none" stroke="url(#phoneEdge)" stroke-width="16"/>
    <rect x="1232" y="39" width="334" height="722" rx="58" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
  </g>

  <circle cx="1502" cy="154" r="5" fill="#6ce0bc" opacity="0.75"/>
  <circle cx="1534" cy="119" r="3" fill="#6ce0bc" opacity="0.55"/>
  <circle cx="1553" cy="183" r="3" fill="#6ce0bc" opacity="0.42"/>
</svg>
